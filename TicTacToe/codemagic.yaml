name: ios-workflow

workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "TicTacToe.xcodeproj"
        XCODE_SCHEME: "TicTacToe"
        BUNDLE_ID: "com.tictactoe.app"
      xcode: 15.0
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          # Если используются CocoaPods
          # pod install
          echo "No dependencies to install"
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - user@example.com
